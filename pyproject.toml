[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scandoc"
version = "0.2.0"
authors = [
  { name="Thomas Ascioglu", email="thomasascioglu@gmail.com" },
]
maintainers = [
  { name="Thomas Ascioglu", email="thomasascioglu@gmail.com" },
]
description = "Detect and crop documents in an image."
readme = "README.md"
keywords = ["doc", "paper", "document", "scanner", "scan", "image", "crop", "detect"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy==2.3.5",
    "opencv-python-headless==4.13.0.92",
    "pillow==12.3.0",
    "reportlab>=4.4,<5",
]

[project.optional-dependencies]
desktop = ["matplotlib==3.10.8"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20", "httpx>=0.28,<1", "cryptography>=44", "pydantic-settings>=2.8,<3"]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "pypdf>=5,<7"]

[tool.setuptools.package-data]
scandoc = ["web/static/**/*", "web/static/*"]

[project.scripts]
scandoc = "scandoc.main_cli:main_cli"

[project.urls]
Homepage = "https://github.com/thomsan/scandoc"
Issues = "https://github.com/thomsan/scandoc/issues"
